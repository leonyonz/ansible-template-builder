---
# Config per OS — data, bukan logika.
# Pin ke nama versi (immutable). Jangan pakai -latest — race: CHECKSUM vs image bisa beda hash.
image_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2
checksum_url: https://dl.rockylinux.org/pub/rocky/10/images/x86_64/CHECKSUM
checksum_algorithm: sha256
checksum_file: CHECKSUM
image_file: Rocky-10-GenericCloud-Base-10.2-20260525.0.x86_64.qcow2

repo_dest_dir: /etc/yum.repos.d/
repo_filename: local.repo
repo_disable_cmd: "sed -i \"s/enabled=1/enabled=0/\" /etc/yum.repos.d/*.repo"

repo_file_content: |
  [baseos]
  name=Rocky $releasever - BaseOS (local)
  baseurl=https://mirror.biznetgio.com/rocky/10/BaseOS/x86_64/os/
  enabled=1
  gpgcheck=1
  gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-10

  [appstream]
  name=Rocky $releasever - AppStream (local)
  baseurl=https://mirror.biznetgio.com/rocky/10/AppStream/x86_64/os/
  enabled=1
  gpgcheck=1
  gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-10

update_cmd: "dnf -y update && dnf -y autoremove && dnf clean all"

---
# Semua pakai virt-customize (libguestfs): edit image offline, tanpa boot VM.
# Kalau update kernel gagal di chroot (dracut/grub error):
#   fallback = boot VM sekali, update di dalam, shutdown, baru template.
# Pakai form argv (bukan string) — biar isi --run-command tidak kepecah shell.
# --mem: RAM appliance; OOM = qemu killed by signal 9 → naikkan virt_mem.
- name: Stage repo config file
  ansible.builtin.copy:
    dest: "{{ workdir }}/{{ repo_filename }}"
    content: "{{ repo_file_content }}"
  when: repo_file_content | length > 0

- name: Matikan repo bawaan (khusus dnf)
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --run-command
      - "{{ repo_disable_cmd }}"
  when: repo_disable_cmd | length > 0

- name: Inject repo config ke image
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --copy-in
      - "{{ workdir }}/{{ repo_filename }}:{{ repo_dest_dir }}"
  when: repo_file_content | length > 0
  # TODO: GPG key repo lokal — copy-in {{ role_path }}/files/<key> ke /etc/apt/trusted.gpg.d/

- name: Update + upgrade packages (patch CVE, kernel)
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --run-command
      - "{{ update_cmd }}"
  # urutan penting: repo lokal DULU (step di atas), baru update — biar narik dari mirror lokal

- name: Regenerate initramfs per kernel (khusus dnf)
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --run-command
      # dracut polos di chroot pakai uname -r = kernel appliance (salah).
      # Loop eksplisit per kernel dari /boot → initramfs konsisten.
      - "if command -v dracut >/dev/null 2>&1; then for k in /boot/vmlinuz-*; do v=${k#/boot/vmlinuz-}; dracut -f /boot/initramfs-$v.img \"$v\" 2>/dev/null; done; fi"
  when: repo_disable_cmd | length > 0

- name: Baca versi kernel terpasang di image
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --run-command
      - "ls /boot/vmlinuz-*"
  register: kernel_ver
  changed_when: false

- name: Bersihkan state (machine-id, log)
  ansible.builtin.command:
    argv:
      - virt-customize
      - -a
      - "{{ workdir }}/{{ image_file }}"
      - --mem
      - "{{ virt_mem }}"
      - --run-command
      # rm -f toleran file yang tidak ada (Alma/Rocky tidak punya /var/lib/dbus/machine-id)
      - "rm -f /var/lib/dbus/machine-id && : > /etc/machine-id && rm -rf /var/log/*"

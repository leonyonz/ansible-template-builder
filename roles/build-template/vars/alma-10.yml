---
# Config per OS — data, bukan logika.
# Pin ke nama versi (immutable). Jangan pakai -latest — race: CHECKSUM vs image bisa beda hash.
image_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2
checksum_url: https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/CHECKSUM
checksum_algorithm: sha256
checksum_file: CHECKSUM
image_file: AlmaLinux-10-GenericCloud-10.2-20260526.0.x86_64.qcow2

repo_dest_dir: /etc/yum.repos.d/
repo_filename: local.repo
# dnf5 baca repo dari 3 dir (/etc/yum.repos.d, /etc/yum/repos.d, /etc/distro.repos.d).
# Hapus semua repo bawaan, biar local.repo satu-satunya — hindari duplikat ID baseos/appstream.
repo_disable_cmd: "rm -f /etc/yum.repos.d/*.repo /etc/yum/repos.d/*.repo /etc/distro.repos.d/*.repo"

repo_file_content: |
  [baseos]
  name=AlmaLinux $releasever - BaseOS (local)
  baseurl=https://mirror.biznetgio.com/almalinux/10/BaseOS/x86_64/os/
  enabled=1
  gpgcheck=1
  gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10

  [appstream]
  name=AlmaLinux $releasever - AppStream (local)
  baseurl=https://mirror.biznetgio.com/almalinux/10/AppStream/x86_64/os/
  enabled=1
  gpgcheck=1
  gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-10

update_cmd: "dnf -y update && dnf -y autoremove && dnf clean all"

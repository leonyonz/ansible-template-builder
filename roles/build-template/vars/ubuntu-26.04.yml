---
# Config per OS — data, bukan logika.
image_url: https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img
checksum_url: https://cloud-images.ubuntu.com/releases/resolute/release/SHA256SUMS
checksum_algorithm: sha256
checksum_file: SHA256SUMS
image_file: ubuntu-26.04-server-cloudimg-amd64.img

repo_dest_dir: /etc/apt/sources.list.d/
repo_filename: local.list
repo_disable_cmd: ""

repo_file_content: |
  deb https://mirror.biznetgio.com/ubuntu resolute main universe
  deb https://mirror.biznetgio.com/ubuntu resolute-updates main universe
  deb https://mirror.biznetgio.com/ubuntu resolute-security main universe

update_cmd: "apt-get update -y && apt-get full-upgrade -y && apt-get autoremove -y && apt-get clean"
